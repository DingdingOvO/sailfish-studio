<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sailfish Studio 文档中心</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #2563EB;
      --blue-dim: #1d4ed8;
      --bg: #0f0f0f;
      --bg-sidebar: #161616;
      --bg-card: #1a1a1a;
      --border: #2a2a2a;
      --text: #e4e4e7;
      --text-dim: #a1a1aa;
      --text-muted: #71717a;
      --scrollbar-thumb: #3a3a3a;
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header h1 .logo {
      width: 22px; height: 22px;
      background: var(--blue);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
    }
    .sidebar-header .version {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
    }
    .nav-item:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }
    .nav-item.active {
      color: var(--blue);
      border-left-color: var(--blue);
      background: rgba(37,99,235,0.08);
    }
    .nav-item .num {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 20px;
      text-align: right;
    }
    .nav-item.active .num { color: var(--blue); }

    .nav-heading {
      padding: 16px 20px 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .main-header {
      height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      flex-shrink: 0;
    }
    .menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      width: 34px; height: 34px;
      cursor: pointer;
      font-size: 16px;
      align-items: center;
      justify-content: center;
    }
    .breadcrumb {
      font-size: 13px;
      color: var(--text-muted);
    }
    .breadcrumb span { color: var(--text); }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px 80px;
      max-width: 860px;
    }
    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

    /* ── Markdown rendered ── */
    .markdown-body { line-height: 1.75; }
    .markdown-body h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; color: #fff; }
    .markdown-body h2 { font-size: 20px; font-weight: 700; margin: 32px 0 12px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .markdown-body h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; color: var(--text); }
    .markdown-body h4 { font-size: 14px; font-weight: 600; margin: 20px 0 6px; color: var(--text-dim); }
    .markdown-body p { margin: 12px 0; color: var(--text-dim); }
    .markdown-body ul, .markdown-body ol { margin: 8px 0; padding-left: 24px; color: var(--text-dim); }
    .markdown-body li { margin: 4px 0; }
    .markdown-body strong { color: var(--text); font-weight: 600; }
    .markdown-body code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      color: #93c5fd;
    }
    .markdown-body pre {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      overflow-x: auto;
    }
    .markdown-body pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      color: var(--text);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
    }
    .markdown-body thead th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--text);
      font-weight: 600;
    }
    .markdown-body tbody td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
    }
    .markdown-body tbody tr:hover { background: rgba(255,255,255,0.02); }
    .markdown-body a {
      color: var(--blue);
      text-decoration: none;
    }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body blockquote {
      border-left: 3px solid var(--blue);
      padding: 8px 16px;
      margin: 16px 0;
      background: rgba(37,99,235,0.06);
      border-radius: 0 6px 6px 0;
      color: var(--text-dim);
    }
    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* Nav links at bottom of pages */
    .markdown-body p a[href^="./"] {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      transition: all 0.15s;
    }
    .markdown-body p a[href^="./"]:hover {
      border-color: var(--blue);
      background: rgba(37,99,235,0.08);
      text-decoration: none;
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      font-size: 14px;
      gap: 8px;
    }
    .loading .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Mobile overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 90;
    }
    .overlay.show { display: block; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: inline-flex; }
      .content { padding: 24px 20px 80px; }
      .markdown-body h1 { font-size: 22px; }
      .markdown-body h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span class="logo">S</span> Sailfish Studio</h1>
      <div class="version">文档中心 v1.0-Beta.1</div>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
  </aside>

  <div class="main">
    <div class="main-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="breadcrumb" id="breadcrumb">Sailfish Studio / <span>README</span></div>
    </div>
    <div class="content" id="content">
      <div class="loading"><div class="spinner"></div>加载中…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script>
    const SECTIONS = [
      {
        title: '需求规格',
        base: 'docs/requirements/',
        docs: [
          { file: 'README.md',         label: 'README',         num: '' },
          { file: '00-constants.md',   label: '文档约定与常量', num: '00' },
          { file: '01-overview.md',     label: '项目概述',       num: '01' },
          { file: '02-concepts.md',     label: '核心概念',       num: '02' },
          { file: '03-architecture.md', label: '技术架构',      num: '03' },
          { file: '04-editor.md',       label: '积木编辑器',     num: '04' },
          { file: '05-collaboration.md',label: '多人协作',      num: '05' },
          { file: '06-ui.md',          label: 'UI 与设计语言',  num: '06' },
          { file: '07-extensions.md',   label: '扩展与插件',     num: '07' },
          { file: '08-runtime.md',      label: '运行时与打包',   num: '08' },
          { file: '09-platform.md',     label: '跨平台',         num: '09' },
          { file: '10-debug.md',        label: '调试与日志',     num: '10' },
          { file: '11-nfr.md',          label: '非功能性需求',   num: '11' },
          { file: '12-roadmap.md',      label: '路线图',         num: '12' },
          { file: '13-appendices.md',   label: '附录',           num: '13' },
          { file: '14-changelog.md',    label: '变更历史',       num: '14' },
        ]
      },
      {
        title: '设计文档',
        base: 'docs/design/',
        docs: [
          { file: 'README.md',                          label: 'README',       num: '' },
          { file: 'architecture/01-process-model.md',   label: '进程模型',     num: 'A1' },
          { file: 'architecture/02-ipc-protocol.md',    label: 'IPC 协议',    num: 'A2' },
          { file: 'architecture/03-data-flow.md',       label: '数据流',       num: 'A3' },
          { file: 'ui/01-design-principles.md',         label: '设计原则',     num: 'U1' },
          { file: 'ui/02-color-system.md',              label: '色彩体系',     num: 'U2' },
          { file: 'ui/03-typography.md',                label: '字体排版',     num: 'U3' },
          { file: 'ui/04-spacing-grid.md',              label: '间距网格',     num: 'U4' },
          { file: 'ui/05-iconography.md',               label: '图标系统',     num: 'U5' },
          { file: 'ui/06-motion.md',                    label: '动画规范',     num: 'U6' },
          { file: 'ui/07-components/button.md',          label: '按钮',         num: 'U7' },
          { file: 'ui/07-components/input.md',            label: '输入框',       num: 'U8' },
          { file: 'ui/07-components/dialog.md',           label: '弹窗',         num: 'U9' },
          { file: 'ui/07-components/tree-view.md',       label: '树形视图',     num: 'U10' },
          { file: 'ui/07-components/block-canvas.md',    label: '积木画布',     num: 'U11' },
          { file: 'ui/07-components/status-bar.md',      label: '状态栏',       num: 'U12' },
          { file: 'ui/08-layout.md',                    label: '编辑器布局',   num: 'U13' },
          { file: 'ui/09-dark-mode.md',                label: '深色模式',     num: 'U14' },
          { file: 'ui/10-accessibility.md',             label: '无障碍',       num: 'U15' },
          { file: 'language/02-syntax.md',              label: 'SF 语言语法',  num: 'L1' },
          { file: 'language/03-type-system.md',         label: '类型系统',     num: 'L2' },
          { file: 'collaboration/01-protocol.md',       label: '协作协议',     num: 'C1' },
          { file: 'collaboration/02-room-server.md',    label: '房间服务器',   num: 'C2' },
          { file: 'testing/01-test-pyramid.md',         label: '测试金字塔',   num: 'T1' },
        ]
      }
    ];
    const contentEl = document.getElementById('content');
    const navEl = document.getElementById('nav');
    const breadcrumbEl = document.getElementById('breadcrumb');

    // Register highlight languages
    ['bash','c','cpp','css','ini','json','markdown','rust','sql','typescript','xml','yaml'].forEach(lang => {
      const s = document.createElement('script');
      s.src = `https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/${lang}.min.js`;
      s.onload = () => { if (window.hljs) hljs.registerLanguage(lang, window['hljsLanguages']?.[lang]); };
      document.head.appendChild(s);
    });

    // Build nav
    let globalIdx = 0;
    const docIndex = []; // flat index: { base, file, label, num }
    SECTIONS.forEach(section => {
      const heading = document.createElement('div');
      heading.className = 'nav-heading';
      heading.textContent = section.title;
      navEl.appendChild(heading);
      section.docs.forEach(doc => {
        const idx = globalIdx++;
        docIndex.push({ base: section.base, file: doc.file, label: doc.label, num: doc.num });
        const a = document.createElement('a');
        a.className = 'nav-item';
        a.dataset.idx = idx;
        a.href = '#' + section.base + doc.file.replace('.md', '');
        a.innerHTML = `<span class="num">${doc.num}</span>${doc.label}`;
        a.addEventListener('click', e => {
          e.preventDefault();
          loadDoc(idx);
          closeSidebar();
        });
        navEl.appendChild(a);
      });
    });

    // marked config
    marked.setOptions({
      gfm: true,
      highlight: (code, lang) => {
        if (window.hljs && lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return code;
      }
    });

    let currentIdx = -1;

    async function loadDoc(idx) {
      if (idx === currentIdx) return;
      currentIdx = idx;
      const doc = docIndex[idx];

      // Active nav
      document.querySelectorAll('.nav-item').forEach((el, i) => {
        el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
      });

      // Breadcrumb
      const section = SECTIONS.find(s => s.base === doc.base);
      breadcrumbEl.innerHTML = `${section ? section.title : 'Sailfish Studio'} / <span>${doc.label}</span>`;

      // Loading
      contentEl.innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';

      try {
        const res = await fetch(doc.base + doc.file);
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        contentEl.innerHTML = '<div class="markdown-body">' + marked.parse(md) + '</div>';

        // Intercept internal links
        contentEl.querySelectorAll('a[href^="./"]').forEach(a => {
          const href = a.getAttribute('href');
          const targetFile = href.replace('./', '');
          // Search in same section first, then all sections
          const targetIdx = docIndex.findIndex(d => {
            const path = d.base + d.file;
            return path === doc.base + targetFile || path.endsWith(targetFile);
          });
          if (targetIdx !== -1) {
            a.addEventListener('click', e => {
              e.preventDefault();
              loadDoc(targetIdx);
              contentEl.scrollTop = 0;
            });
          }
        });

        contentEl.scrollTop = 0;
      } catch (err) {
        contentEl.innerHTML = `<div class="markdown-body"><p>加载失败: ${err.message}</p></div>`;
      }
    }

    // Sidebar toggle (mobile)
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    // Init from hash or default
    function init() {
      const hash = location.hash.replace('#', '');
      const idx = docIndex.findIndex(d => (d.base + d.file.replace('.md', '')).endsWith(hash) || d.file.replace('.md', '') === hash);
      loadDoc(idx !== -1 ? idx : 0);
    }
    window.addEventListener('hashchange', init);
    init();
  </script>
</body>
</html>
