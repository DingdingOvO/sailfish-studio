name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === Rust Core ===
  rust-check:
    name: Rust – Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sf-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sf-core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all

  # === Editor (TypeScript) ===
  editor-test:
    name: Editor – Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sf-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sf-editor/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # === Python Tools ===
  python-test:
    name: Tools – Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sf-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - name: Run tests
        run: python -m pytest scripts/tests/ -v
