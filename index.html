<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sailfish Studio 文档中心 - 下一代积木式编程开发环境" />
  <meta name="color-scheme" content="dark" />
  <title>Sailfish Studio 文档中心</title>

  <!-- 外部样式 -->
  <link rel="stylesheet" href="style.css" />
  <!-- highlight.js 主题（按需加载） -->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" /></noscript>

  <!-- 核心依赖：预连接 CDN -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://raw.githubusercontent.com" />
</head>
<body>
  <!-- 移动端遮罩 -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- 侧栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span class="logo">S</span> Sailfish Studio</h1>
      <div class="version">文档中心 v1.0-Beta.1</div>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer">
      <span class="dot"></span> 6 大类 · 91 份文档 · 全部索引
    </div>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <div class="main-header">
      <button class="menu-btn" onclick="toggleSidebar()" aria-label="菜单">☰</button>
      <div class="breadcrumb" id="breadcrumb">Sailfish Studio / <span>README</span></div>
      <div style="flex:1"></div>
      <a id="raw-toggle" class="raw-toggle" href="#" title="查看纯文本">Raw</a>
    </div>
    <div class="content" id="content">
      <div class="loading"><div class="spinner"></div>加载文档中…</div>
    </div>
  </div>

  <!-- 外部脚本：按依赖顺序动态加载 -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script defer src="app.js"></script>

  <!-- highlight.js 语言包：延迟加载 -->
  <script>
    (function() {
      const LANGS = ['bash','c','cpp','css','ini','json','markdown','rust','sql','typescript','xml','yaml'];
      setTimeout(() => {
        LANGS.forEach(lang => {
          const s = document.createElement('script');
          s.src = `https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/${lang}.min.js`;
          document.head.appendChild(s);
        });
      }, 200);
    })();
  </script>
</body>
</html>
