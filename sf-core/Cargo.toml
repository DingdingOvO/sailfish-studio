[workspace]
resolver = "2"
members = [
    "sf-vm",
    "sf-parser",
    "sf-blocks",
    "sf-renderer",
    "sf-storage",
    "sf-audio",
    "sf-aot-compiler",
    "sf-packager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
