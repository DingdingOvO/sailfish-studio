[package]
name = "sf-runtime"
version = "0.1.0"
edition = "2021"
description = "Sailfish Studio Runtime CLI"

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
toml = "0.8"
walkdir = "2"
zip = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
