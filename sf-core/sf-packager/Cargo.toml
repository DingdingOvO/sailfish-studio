[package]
name = "sf-packager"
version.workspace = true
edition.workspace = true
description = "Sailfish Studio Packager - export projects to various formats"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zip = { version = "2", default-features = true }
base64 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
